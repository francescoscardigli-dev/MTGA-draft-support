[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "draftbot"
version = "0.0.1"
description = "Assistente locale per i draft di MTG Arena (Premier e Pick Two)"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["draftbot", "draftbot.sources", "draftbot.arenalog", "draftbot.stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
